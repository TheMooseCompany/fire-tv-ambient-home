name: Build

# Runs when a release is published on GitHub (Releases → Draft a new release → tag v1.0.0 →
# Publish); the APK and its checksum are attached to that release. Can also be run by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret set; building with a throwaway debug key."
          fi

      - name: Build the APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.release.tag_name || format('0.0.{0}', github.run_number) }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Name it and record its checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk ambient-home.apk
          sha256sum ambient-home.apk | tee ambient-home.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ambient-home
          path: |
            ambient-home.apk
            ambient-home.apk.sha256

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ambient-home.apk ambient-home.apk.sha256 --clobber -R "$GITHUB_REPOSITORY"
